services:
  - type: web
    name: finpilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /login
    envVars:
      - key: FINPILOT_SECRET
        generateValue: true
      - key: FINPILOT_DB
        value: /var/data/finpilot.db
      - key: FINPILOT_COOKIE_SECURE
        value: '1'
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: finpilot-data
      mountPath: /var/data
      sizeGB: 1
