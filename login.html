<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · FinPilot</title><link rel="stylesheet" href="/style.css"></head><body><div class="auth-wrap"><div class="auth-card"><a class="brand" href="/">Fin<span>Pilot</span></a><h1 class="heading">Welcome back</h1><p class="subheading" style="margin-bottom:22px">Sign in to your personal finance workspace.</p><form id="form"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button type="submit">Sign in</button><p class="muted" id="error"></p></form><p class="muted">New to FinPilot? <a href="/register" style="color:var(--primary)">Create an account</a></p></div></div><script src="/common.js"></script><script>$('#form').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';try{let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();if(!r.ok)throw Error(d.message);location.href=d.redirect}catch(x){$('#error').textContent=x.message}};</script></body></html>
